name: release

# release-please reads the conventional commits on main and keeps a release PR
# open that bumps the version and updates CHANGELOG.md. Merging that PR tags the
# release and publishes it; then the build workflow attaches the binaries.
# (A tag created with the workflow's own token doesn't trigger other workflows,
# so the build is called from here rather than on the tag push.)
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
