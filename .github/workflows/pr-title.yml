name: pr-title

# PRs are squash-merged, so the PR title becomes the commit on main, and
# release-please builds the changelog and the version bump from those commits.
# This checks the title is a conventional commit (feat:, fix:, docs: ...).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
