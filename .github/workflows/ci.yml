# Tonebench test CI. This workflow is the TEST gate only — it builds the C++
# unit tests + offline bench on all three OSes and runs them, and lints/builds/
# tests the React UI. The cross-platform RELEASE build matrix lives in a separate
# build.yml (owned elsewhere); do not duplicate packaging here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: C++ tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       name: macOS }
          - { os: ubuntu-latest,  name: Linux }
          - { os: windows-latest, name: Windows }
    steps:
      - uses: actions/checkout@v4

      # Configure needs the GUI app's platform deps even though only the CLI and
      # unit tests are built (JUCE resolves the WebView at configure time).
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libjack-jackd2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev

      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory $dest -ExcludeVersion

      # FetchContent pulls JUCE, NeuralAmpModelerCore and Catch2 on first configure.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # Only the offline bench and the unit tests: they share the real engine and
      # app-logic sources with the app but need no Node/WebUI, so the gate stays fast.
      - name: Build tests
        run: cmake --build build --config RelWithDebInfo --target tonebench_cli tonebench_tests

      # Runs every Catch2 test case plus the self-test. selftest_strict turns a
      # skipped CORE suite into a failure, so green-but-skipped can't pass.
      - name: Run tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  ui-tests:
    name: UI lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # End-to-end: the real app in Chromium against the in-browser mock engine.
      # Playwright starts the Vite dev server itself (playwright.config.ts).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7
