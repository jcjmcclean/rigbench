# Tonebench test CI. This workflow is the TEST gate only — on all three OSes it
# builds and runs the C++ unit tests + offline bench, then builds the app and
# boots it (--smoke); and it lints/builds/tests the React UI (unit + e2e). The cross-platform RELEASE build matrix lives in a separate
# build.yml (owned elsewhere); do not duplicate packaging here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: C++ tests + app smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       name: macOS }
          - { os: ubuntu-latest,  name: Linux }
          - { os: windows-latest, name: Windows }
    steps:
      - uses: actions/checkout@v4

      # The app's platform deps (WebView, audio, X11) plus xvfb to boot it headless.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libjack-jackd2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            xvfb

      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory $dest -ExcludeVersion

      # The app target embeds the React UI, so it needs Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      # FetchContent pulls JUCE, NeuralAmpModelerCore and Catch2 on first configure.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build tests
        run: cmake --build build --config RelWithDebInfo --parallel --target tonebench_cli tonebench_tests

      # Runs every Catch2 test case plus the self-test. selftest_strict turns a
      # skipped CORE suite into a failure, so green-but-skipped can't pass.
      - name: Run tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      # Build the real app and boot it: --smoke opens the window without an audio
      # device, waits for the React UI to reach the engine over the bridge, and
      # exits 0 (or 1 after 30 s). The only check that the WebView actually works
      # on each OS (WKWebView / WebView2 / WebKitGTK).
      - name: Build app
        run: cmake --build build --config RelWithDebInfo --parallel --target Tonebench

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./build/Tonebench_artefacts/RelWithDebInfo/Tonebench.app/Contents/MacOS/Tonebench --smoke

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        # WebKitGTK's sandbox can't start on the Ubuntu runner (unprivileged user
        # namespaces are restricted), so the CI box runs it without one.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: xvfb-run -a ./build/Tonebench_artefacts/RelWithDebInfo/Tonebench --smoke

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\Tonebench_artefacts\RelWithDebInfo\Tonebench.exe" -ArgumentList "--smoke" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

  ui-tests:
    name: UI lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # End-to-end: the real app in Chromium against the in-browser mock engine.
      # Playwright starts the Vite dev server itself (playwright.config.ts).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7
