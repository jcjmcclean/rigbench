name: build

# Produce a per-OS Tonebench artifact. The Mac can only build Mac, so each
# platform builds on its own native runner (WebKitGTK / WebView2 / WKWebView and
# the VST3 + MSVC/clang toolchains are all native-only — no cross-compiling).
# Triggered manually or on a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS,   cmake_args: "-DTONEBENCH_UNIVERSAL=ON" }
          - { os: ubuntu-latest,  name: Linux,   cmake_args: "" }
          - { os: windows-latest, name: Windows, cmake_args: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The CMake tonebench_ui target runs `npm run build`; install deps first.
      - name: Install UI deps
        working-directory: ui
        run: npm ci

      # Linux: JUCE needs the WebView (webkit2gtk), GTK, ALSA, X11 and font libs.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libjack-jackd2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            ninja-build

      # Windows: JUCE's NEEDS_WEBVIEW2 needs the Microsoft.Web.WebView2 package.
      # Its FindWebView2 globs %USERPROFILE%\AppData\Local\PackageManagement\NuGet\
      # Packages for *Microsoft.Web.WebView2*, so install straight there with
      # nuget.exe (reliable on the runner) and no CMake flag is needed. Version
      # pinned to what JUCE 8.0.15 asks for.
      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory $dest -ExcludeVersion
          if (-not (Test-Path "$dest\Microsoft.Web.WebView2\build\native\include\WebView2.h")) { throw "WebView2 package not laid out as expected" }

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --target Tonebench

      # Package: macOS -> DMG, Linux -> tarball, Windows -> zip.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/make-dmg.sh build

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/Tonebench_artefacts/RelWithDebInfo
          tar czf "$GITHUB_WORKSPACE/Tonebench-linux.tar.gz" Tonebench

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Recurse -Filter Tonebench.exe build | Select-Object -First 1
          Compress-Archive -Path $app.DirectoryName/* -DestinationPath Tonebench-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Tonebench-${{ matrix.name }}
          path: |
            dist/*.dmg
            Tonebench-linux.tar.gz
            Tonebench-windows.zip
          if-no-files-found: ignore

  # On a v* tag, publish a GitHub Release with the macOS/Linux/Windows binaries
  # attached, so "release" produces real downloads for everyone. Manual
  # (workflow_dispatch) runs just leave the artifacts on the run.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find artifacts -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.zip' \))
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Tonebench ${{ github.ref_name }}" \
            --generate-notes \
            $files
